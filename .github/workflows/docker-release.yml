name: Build release image using Frankenphp for Docker Hub
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Git tag / version to build (e.g. 1.4.1)'
        required: true
  release:
    types: [published]

env:
  VERSION: ${{ github.event.release.tag_name || inputs.version }}

jobs:
  push_release_image:
    name: Build release image using Frankenphp for Docker Hub
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repo
        uses: actions/checkout@v6
        with:
          repository: benjaminjonard/mendako
          ref: ${{ env.VERSION }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          file: Dockerfile
          push: true
          tags: docker.io/benjaminjonard/mendako,docker.io/benjaminjonard/mendako:latest,docker.io/benjaminjonard/mendako:${{ env.VERSION }}
          platforms: linux/amd64,linux/arm64

      - name: Build and push ML sidecar
        uses: docker/build-push-action@v7
        with:
          context: ./ml
          push: true
          tags: docker.io/benjaminjonard/mendako-ml,docker.io/benjaminjonard/mendako-ml:latest,docker.io/benjaminjonard/mendako-ml:${{ env.VERSION }}
          platforms: linux/amd64,linux/arm64
