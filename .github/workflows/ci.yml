name: CI
on:
  workflow_dispatch:
  push:
  release:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true

jobs:
  build_docker_ci_container:
    name: Build Docker CI container for ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Container
        uses: docker/build-push-action@v7
        with:
          file: Dockerfile
          tags: ci-image
          push: false
          outputs: type=docker,dest=/tmp/ci-container.tar

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ci-container-${{ matrix.arch }}
          path: /tmp/ci-container.tar

  remove_docker_ci_container:
    name: Remove Docker CI container
    if: always()
    runs-on: ubuntu-latest
    needs: [ build_docker_ci_container, smoke_test, phpunit_postgres, doctrine_schema_validator ]
    steps:
      - uses: geekyeggo/delete-artifact@v6
        with:
          name: |
            ci-container-amd64
            ci-container-arm64

  smoke_test:
    name: Smoke test on ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    needs: [ build_docker_ci_container ]
    strategy:
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_PASSWORD: root
          POSTGRES_DB: mendako
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: ci-container-${{ matrix.arch }}
          path: /tmp

      - name: Load image
        run: docker load --input /tmp/ci-container.tar

      - name: Start container
        run: |
          docker run -d --name mendako \
            --add-host=host.docker.internal:host-gateway \
            -p 8080:80 \
            -e APP_SECRET=changeMe \
            -e DB_NAME=mendako \
            -e DB_HOST=host.docker.internal \
            -e DB_PORT=5432 \
            -e DB_USER=postgres \
            -e DB_PASSWORD=root \
            -e DB_VERSION=18 \
            ci-image

      - name: Check that the application responds
        run: |
          for i in $(seq 1 60); do
            if curl -fsSL -o /dev/null http://localhost:8080/; then
              exit 0
            fi
            sleep 5
          done
          docker logs mendako
          exit 1
          
  ml_tests:
    name: ML service tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: ml
        run: pip install -r requirements-dev.txt

      - name: Run tests
        working-directory: ml
        run: pytest

  security_checker:
    name: Security checker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/cache@v6
        id: cache-db
        with:
          path: ~/.symfony/cache
          key: db
      - uses: symfonycorp/security-checker-action@v5

  doctrine_schema_validator:
    name: Doctrine schema validator
    runs-on: ubuntu-latest
    needs: [ build_docker_ci_container ]
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: ci-container-amd64
          path: /tmp

      - name: Load image
        run: docker load --input /tmp/ci-container.tar

      - name: Run doctrine schema validator
        uses: addnab/docker-run-action@v3
        with:
          image: ci-image
          run: |
            bin/console doctrine:schema:validate --skip-sync

  phpunit_postgres:
    name: PHPUnit tests with Postgres ${{ matrix.postgres }}
    needs: [ build_docker_ci_container ]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        postgres: [ 15, 16, 17, 18 ]
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: ci-container-amd64
          path: /tmp

      - name: Load image
        run: docker load --input /tmp/ci-container.tar

      - name: Create Docker network
        run: docker network create test-network

      - name: Start PostgreSQL with pgvector
        run: |
          docker run -d --name postgres --network test-network \
            -e POSTGRES_PASSWORD=root \
            pgvector/pgvector:pg${{ matrix.postgres }}

      - name: Wait for PostgreSQL to be ready
        run: timeout 60 bash -c 'until docker exec postgres pg_isready -U postgres; do sleep 2; done'

      - name: Run tests
        uses: addnab/docker-run-action@v3
        with:
          image: ci-image
          options: --network test-network -e APP_ENV=test
          run: |
            sed -i "s|APP_ENV=.*|APP_ENV=test|i" ".env"
            sed -i "s|APP_DEBUG=.*|APP_DEBUG=1|i" ".env"
            sed -i "s|APP_SECRET=.*|APP_SECRET=aRandomSecret|i" ".env"
            sed -i "s|DB_NAME=.*|DB_NAME=mendako|i" ".env"
            sed -i "s|DB_HOST=.*|DB_HOST=postgres|i" ".env"
            sed -i "s|DB_PORT=.*|DB_PORT=5432|i" ".env"
            sed -i "s|DB_USER=.*|DB_USER=postgres|i" ".env"
            sed -i "s|DB_PASSWORD=.*|DB_PASSWORD=root|i" ".env"
            sed -i "s|DB_VERSION=.*|DB_VERSION=${{ matrix.postgres }}|i" ".env"
            sed -i "s|APP_AUTOTAG_ENABLED=.*|APP_AUTOTAG_ENABLED=1|i" ".env"
            bin/console doctrine:database:create --env=test
            bin/console doctrine:migration:migrate --no-interaction --allow-no-migration --env=test
            php ./vendor/bin/paratest --runner=WrapperRunner
