version: 2
updates:
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "daily"
    groups:
        symfony:
          patterns:
            - "symfony/*"
        doctrine:
          patterns:
            - "doctrine/*"
        twig:
          patterns:
            - "twig/*"
        php-testing:
          patterns:
            - "phpunit/*"
            - "brianium/paratest"
            - "dama/doctrine-test-bundle"
            - "zenstruck/foundry"
        composer-misc:
          patterns:
            - "*"
          update-types:
            - "minor"
            - "patch"

  - package-ecosystem: "npm"
    directory: "/assets"
    schedule:
      interval: "daily"
    groups:
      npm-non-major:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "daily"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      gh-actions-non-major:
        update-types:
          - "minor"
          - "patch"
