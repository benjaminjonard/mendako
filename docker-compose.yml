#This docker-compose file is provided for dev purposes
services:
    mendako:
        container_name: mendako
        build:
            dockerfile: Dockerfile.dev
        restart: unless-stopped
        ports:
            - 84:80
        environment:
            - APP_ENV=dev
            - APP_DEBUG=1
            - DB_DRIVER=pdo_pgsql
            - DB_NAME=mendako
            - DB_HOST=postgresql
            - DB_PORT=5432
            - DB_USER=postgres
            - DB_PASSWORD=password
            - DB_VERSION=16
            - PHP_TIMEZONE=Europe\Paris
            - HTTPS_ENABLED=0
            - APP_THUMBNAILS_FORMAT=webp
            - POST_PER_PAGE=20
            - INFINITE_SCROLL_POST_PER_PAGE=50
            - UPLOAD_MAX_FILESIZE=200M
        depends_on:
            - postgresql
        volumes:
            - "./docker/volumes/mendako/public/uploads:/uploads"
            - "./docker/volumes/mendako/public/thumbnails:/thumbnails"
            - ./:/app/public

    # Optional tagging inference service
    mendako_ml:
        container_name: mendako_ml
        build: ./ml
        restart: unless-stopped
        # Models are baked into the image (see ml/Dockerfile). The app bind-mount is a dev
        # convenience: the image already contains this code, but mounting the source lets ML
        # code changes apply on a container restart without a multi-GB rebuild.
        volumes:
            - "./ml/app:/app/app"

    # Optional tagging worker — INTERACTIVE queue only (fresh uploads). Kept on its own
    # process so a running backlog (embedding/retroactive tagging on autotag_batch, drained by
    # mendako_worker_batch) can never block auto-tagging of a new upload. The two workers run in
    # parallel; on this CPU-bound setup they share cores rather than multiply throughput, but an
    # upload starts immediately instead of queueing behind the backlog.
    mendako_worker:
        container_name: mendako_worker
        build:
            dockerfile: Dockerfile.dev
        restart: unless-stopped
        environment:
            - APP_ENV=dev
            - DB_DRIVER=pdo_pgsql
            - DB_NAME=mendako
            - DB_HOST=postgresql
            - DB_PORT=5432
            - DB_USER=postgres
            - DB_PASSWORD=password
            - DB_VERSION=16
            - PHP_TIMEZONE=Europe\Paris
        depends_on:
            - postgresql
        volumes:
            # The worker reads the source media to generate thumbnails for tagging, so it needs
            # the same uploads/thumbnails volumes as the web app (public/uploads & public/thumbnails
            # are symlinks to these mounts — without them the worker sees dangling links).
            - "./docker/volumes/mendako/public/uploads:/uploads"
            - "./docker/volumes/mendako/public/thumbnails:/thumbnails"
            - ./:/app/public
        working_dir: /app/public
        # This is a Messenger consumer, not a web server: the image's default HTTP healthcheck
        # (curl localhost:80) always fails and marks it 'unhealthy'. Disable it.
        healthcheck:
            disable: true
        entrypoint: ["php", "-d", "memory_limit=2G", "bin/console", "messenger:consume", "autotag_interactive", "--time-limit=3600", "--memory-limit=512M"]

    # Optional tagging worker — BATCH queue only (deprioritized backlog: bulk embedding pool +
    # retroactive tagging). Separate process so it never starves interactive uploads. A single
    # batch worker drains embedding and retroactive-tagging messages sequentially, which avoids
    # oversubscribing the single ML service with a third concurrent inference.
    mendako_worker_batch:
        container_name: mendako_worker_batch
        build:
            dockerfile: Dockerfile.dev
        restart: unless-stopped
        environment:
            - APP_ENV=dev
            - DB_DRIVER=pdo_pgsql
            - DB_NAME=mendako
            - DB_HOST=postgresql
            - DB_PORT=5432
            - DB_USER=postgres
            - DB_PASSWORD=password
            - DB_VERSION=16
            - PHP_TIMEZONE=Europe\Paris
        depends_on:
            - postgresql
        volumes:
            - "./docker/volumes/mendako/public/uploads:/uploads"
            - "./docker/volumes/mendako/public/thumbnails:/thumbnails"
            - ./:/app/public
        working_dir: /app/public
        healthcheck:
            disable: true
        # Higher memory ceiling: a backlog run fans out one message per item and, in the dev
        # profiler, every dispatched message is collected in-memory — 128M OOMs on a large library.
        entrypoint: ["php", "-d", "memory_limit=2G", "bin/console", "messenger:consume", "autotag_batch", "--time-limit=3600", "--memory-limit=512M"]

    postgresql:
        image: pgvector/pgvector:pg16
        environment:
            - POSTGRES_DB=mendako
            - POSTGRES_USER=postgres
            - POSTGRES_PASSWORD=password
            - POSTGRES_HOST_AUTH_METHOD=trust
        volumes:
            - "./docker/volumes/postgresql:/var/lib/postgresql/data"

    pgadmin:
        container_name: mendako_pgadmin4
        image: dpage/pgadmin4
        restart: always
        ports:
            - 8080:80
        volumes:
            - "./docker/volumes/sql:/home/sql"
        environment:
            PGADMIN_DEFAULT_EMAIL: admin@admin.com
            PGADMIN_DEFAULT_PASSWORD: password
