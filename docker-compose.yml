#This docker-compose file is provided for dev purposes
services:
    mendako:
        container_name: mendako
        build:
            dockerfile: Dockerfile.dev
        restart: unless-stopped
        ports:
            - "84:80"
        environment:
            - APP_ENV=dev
            - APP_DEBUG=1
            - DB_DRIVER=pdo_pgsql
            - DB_NAME=mendako
            - DB_HOST=postgresql
            - DB_PORT=5432
            - DB_USER=postgres
            - DB_PASSWORD=password
            - DB_VERSION=16
            - PHP_TIMEZONE=Europe\Paris
            - HTTPS_ENABLED=0
            - APP_THUMBNAILS_FORMAT=webp
            - POST_PER_PAGE=20
            - INFINITE_SCROLL_POST_PER_PAGE=50
            - UPLOAD_MAX_FILESIZE=200M
            - APP_AUTOTAG_ENABLED=1
            - APP_ML_URL=http://mendako_ml:8000
            - APP_AUTOTAG_AUTOVALIDATE_THRESHOLD_WD=30
            - APP_AUTOTAG_BOARDS_WITH_WD=anime
        depends_on:
            - postgresql
        volumes:
            - "./docker/volumes/mendako/public/uploads:/uploads"
            - "./docker/volumes/mendako/public/thumbnails:/thumbnails"
            - ./:/app/public

    # Optional, but required for ML tasks
    mendako_ml:
        container_name: mendako_ml
        build: ./ml
        restart: unless-stopped
        volumes:
            - "./ml/app:/app/app"

    postgresql:
        image: pgvector/pgvector:pg16
        environment:
            - POSTGRES_DB=mendako
            - POSTGRES_USER=postgres
            - POSTGRES_PASSWORD=password
            - POSTGRES_HOST_AUTH_METHOD=trust
        volumes:
            - "./docker/volumes/postgresql:/var/lib/postgresql/data"

    pgadmin:
        container_name: mendako_pgadmin4
        image: dpage/pgadmin4
        restart: always
        ports:
            - 8080:80
        volumes:
            - "./docker/volumes/sql:/home/sql"
        environment:
            PGADMIN_DEFAULT_EMAIL: admin@admin.com
            PGADMIN_DEFAULT_PASSWORD: password
